<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.coop-burger,.coop-mnav{display:none}
@media (max-width:860px){
  .coop-nav{display:none!important}
  .coop-burger{display:flex!important}
  .coop-mnav{display:flex!important}
  .coop-hbar{height:72px!important;padding:0 16px!important}
  .coop-logo{height:54px!important}
}
</style>
</helmet>
<header style="background:{{ bg }};border-bottom:1px solid {{ border }};box-shadow:{{ shadow }};font-family:'Instrument Sans',sans-serif;transition:background .35s ease,box-shadow .35s ease,border-color .35s ease">
  <div class="coop-hbar" style="max-width:1240px;margin:0 auto;padding:0 24px;height:{{ height }};display:flex;align-items:center;justify-content:space-between;gap:24px;transition:height .35s ease">
    <a href="/" style="display:flex;align-items:center;gap:12px;color:{{ fg }};text-decoration:none;transition:color .35s ease">
      <img class="coop-logo" src="{{ logoSrc }}" alt="Co-Op Consulting Group" style="height:{{ logoSize }};width:auto;display:block;transition:height .35s ease"></img>
      
    </a>
    <nav class="coop-nav" onClick="{{ navClick }}" style="display:flex;align-items:center;gap:34px;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;flex-wrap:wrap">
      <div style="position:relative" onMouseEnter="{{ openAbout }}" onMouseLeave="{{ closeMenu }}">
        <a href="/#about" style="color:{{ fg }};text-decoration:none;display:flex;gap:6px;align-items:center;padding:30px 0;transition:color .35s ease">About <span style="font-size:9px">▾</span></a>
        <sc-if value="{{ aboutOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;left:-24px;min-width:230px;background:#FBF9F5;border-top:2px solid #C1A738;padding:10px 0;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(20,28,50,0.18);z-index:30">
            <sc-for list="{{ aboutLinks }}" as="l" hint-placeholder-count="3">
              <a href="{{ l.href }}" style="color:#253458;text-decoration:none;font-size:12px;letter-spacing:0.14em;padding:13px 24px;transition:background .2s" style-hover="background:#F3EBDD;color:#253458">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <div style="position:relative" onMouseEnter="{{ openServices }}" onMouseLeave="{{ closeMenu }}">
        <a href="/#services" style="color:{{ fg }};text-decoration:none;display:flex;gap:6px;align-items:center;padding:30px 0;transition:color .35s ease">Services <span style="font-size:9px">▾</span></a>
        <sc-if value="{{ servicesOpen }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;top:100%;left:-24px;min-width:320px;background:#FBF9F5;border-top:2px solid #C1A738;padding:10px 0;display:flex;flex-direction:column;box-shadow:0 18px 40px rgba(20,28,50,0.18);z-index:30">
            <sc-for list="{{ serviceLinks }}" as="l" hint-placeholder-count="5">
              <a href="{{ l.href }}" style="color:#253458;text-decoration:none;font-size:12px;letter-spacing:0.14em;padding:13px 24px;transition:background .2s" style-hover="background:#F3EBDD;color:#253458">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <a href="/#portfolio" style="color:{{ fg }};text-decoration:none;transition:color .35s ease">Portfolio</a>
      <a href="contact.html" style="background:{{ ctaBg }};color:{{ ctaFg }};border:1px solid {{ ctaBorder }};padding:13px 22px;text-decoration:none;transition:background .35s ease,color .35s ease,transform .25s ease,box-shadow .25s ease" style-hover="opacity:0.88">Contact</a>
    </nav>
    <button class="coop-burger" type="button" onClick="{{ toggleMobile }}" aria-label="{{ burgerLabel }}" aria-expanded="{{ mobileExpanded }}" style="align-items:center;justify-content:center;width:44px;height:44px;margin-right:-8px;background:none;border:0;padding:0;cursor:pointer;color:{{ fg }}">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="{{ burgerPath }}"></path></svg>
    </button>
  </div>
  <sc-if value="{{ mobileOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="coop-mnav" onClick="{{ mobileNavClick }}" style="flex-direction:column;border-top:1px solid #E2DACB;background:#FBF9F5;max-height:calc(100vh - 72px);overflow-y:auto;padding:8px 16px 24px;font-size:13px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase">
      <span style="color:#8A7A3A;font-size:11px;padding:16px 0 4px">About</span>
      <sc-for list="{{ aboutMobile }}" as="l" hint-placeholder-count="2">
        <a href="{{ l.href }}" style="color:#253458;text-decoration:none;padding:13px 0;border-bottom:1px solid #EEE7DA">{{ l.label }}</a>
      </sc-for>
      <span style="color:#8A7A3A;font-size:11px;padding:20px 0 4px">Services</span>
      <sc-for list="{{ serviceLinks }}" as="l" hint-placeholder-count="5">
        <a href="{{ l.href }}" style="color:#253458;text-decoration:none;padding:13px 0;border-bottom:1px solid #EEE7DA">{{ l.label }}</a>
      </sc-for>
      <a href="/#portfolio" style="color:#253458;text-decoration:none;padding:20px 0 13px;border-bottom:1px solid #EEE7DA">Portfolio</a>
      <a href="contact.html" style="margin-top:20px;background:#253458;color:#F3EBDD;text-align:center;padding:15px 22px;text-decoration:none">Contact</a>
    </nav>
  </sc-if>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menu: null, y: 0, mobile: false };
  componentDidMount() {
    this.onScroll = () => {
      const y = window.scrollY || document.documentElement.scrollTop || 0;
      const b = y > 40 ? (y > 600 ? 2 : 1) : 0;
      if (b !== this.band) { this.band = b; this.setState({ y: b }); }
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); }
  renderVals() {
    const H = '/';
    const solid = this.state.y >= 1 || this.state.menu || this.state.mobile;
    const pop = this.state.y >= 2;
    return {
      bg: solid ? 'rgba(251,249,245,0.97)' : 'transparent',
      border: solid ? '#E2DACB' : 'rgba(243,235,221,0.18)',
      shadow: solid ? '0 6px 24px rgba(20,28,50,0.10)' : 'none',
      fg: solid ? '#253458' : '#F3EBDD',
      ctaBg: solid ? '#253458' : 'transparent',
      ctaBorder: solid ? '#253458' : 'rgba(243,235,221,0.6)',
      ctaFg: '#F3EBDD',
      height: this.state.y >= 1 ? '80px' : '104px',
      logoSize: this.state.y >= 1 ? '64px' : '84px',
      logoSrc: solid ? 'assets/coop-logo-stacked-dark.png' : 'assets/coop-logo-stacked-light.png',
      popOpacity: pop ? 1 : 0,
      popTransform: pop ? 'translateY(0) scale(1)' : 'translateY(24px) scale(0.92)',
      popPointer: pop ? 'auto' : 'none',
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      aboutLinks: [{label:'About Us',href:H+'#about'},{label:'Our Process',href:H+'#process'},{label:'FAQs',href:H+'#process'}],
      serviceLinks: ['Program Management','Project Budgeting','Strategic Planning','Development Services','Infrastructure Management'].map(t => ({ label: t, href: t.toLowerCase().replace(/ /g, '-') + '.html' })),
      aboutMobile: [{label:'About Us',href:H+'#about'},{label:'Our Process',href:H+'#process'}],
      mobileOpen: !!this.state.mobile,
      mobileExpanded: this.state.mobile ? 'true' : 'false',
      burgerLabel: this.state.mobile ? 'Close menu' : 'Open menu',
      burgerPath: this.state.mobile ? 'M6 6l14 14M20 6L6 20' : 'M3 7h20M3 13h20M3 19h20',
      toggleMobile: () => this.setState({ mobile: !this.state.mobile }),
      mobileNavClick: e => { const a = e.target.closest && e.target.closest('a'); if (!a) return; this.setState({ mobile: false }); const u = new URL(a.href, location.href); if (u.pathname.replace(/\/index(\.html)?$/, '/') === location.pathname.replace(/\/index(\.html)?$/, '/') && u.hash) { const t = document.getElementById(u.hash.slice(1)); if (t) { e.preventDefault(); history.replaceState(null, '', u.hash); window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 72, behavior: 'smooth' }); } } },
      aboutOpen: this.state.menu === 'about',
      servicesOpen: this.state.menu === 'services',
      openAbout: () => this.setState({ menu: 'about' }),
      openServices: () => this.setState({ menu: 'services' }),
      closeMenu: () => this.setState({ menu: null }),
      navClick: e => { const a = e.target.closest && e.target.closest('a'); if (!a) return; const u = new URL(a.href, location.href); if (u.pathname.replace(/\/index(\.html)?$/, '/') === location.pathname.replace(/\/index(\.html)?$/, '/') && u.hash) { const t = document.getElementById(u.hash.slice(1)); if (t) { e.preventDefault(); history.replaceState(null, '', u.hash); window.scrollTo({ top: t.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); this.setState({ menu: null }); } } }
    };
  }
}
</script>
</body>
</html>
